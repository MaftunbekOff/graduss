<!doctype html>
<html lang="uz">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="theme-color" content="#3730a3" />
		<meta name="description" content="graduss: kasb egalari uchun jiddiy ijtimoiy tarmoq." />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="graduss" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="graduss" />
		<meta property="og:title" content="graduss: kasbingiz bilan birga, pog'onama-pog'ona" />
		<meta property="og:description" content="Kasb egalari uchun jiddiy ijtimoiy tarmoq: kanallar, tajriba almashish va bosqichli hamkorlik." />
		<meta property="og:image" content="https://graduss.uz/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					var accent = localStorage.getItem('graduss-theme-accent');
					if (accent) document.documentElement.setAttribute('data-accent', accent);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

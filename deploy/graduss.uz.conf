# graduss.uz — kasblar uchun ijtimoiy tarmoq (SvelteKit SPA + Rust API).
# Statik fayllar: /var/www/graduss ; API: 127.0.0.1:8095 (graduss-api.service).
#
# Joylash:  sudo cp deploy/graduss.uz.conf /etc/nginx/sites-available/graduss.uz
#           sudo ln -sf /etc/nginx/sites-available/graduss.uz /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS: SSL_CERT/SSL_KEY yo'llari deploy/install.sh tomonidan qo'yiladi (vaqtincha self-signed, DNS tayyor bo'lgach Let's Encrypt).

# Kirish/ro'yxatdan o'tishni brute-force'dan himoya: IP bo'yicha daqiqasiga 10 ta.
limit_req_zone $binary_remote_addr zone=graduss_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=graduss_api:10m rate=20r/s;

server {
    listen 80;
    server_name graduss.uz www.graduss.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://graduss.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.graduss.uz;

    ssl_certificate SSL_CERT;
    ssl_certificate_key SSL_KEY;

    server_tokens off;
    return 301 https://graduss.uz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name graduss.uz;

    ssl_certificate SSL_CERT;
    ssl_certificate_key SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    root /var/www/graduss;
    index index.html;

    # Xavfsizlik sarlavhalari. img-src https: — foydalanuvchilar rasm havolasini o'zlari kiritadi.
    include /etc/nginx/snippets/graduss-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 300k;

    location = /api/auth/login    { limit_req zone=graduss_auth burst=5 nodelay; proxy_pass http://127.0.0.1:8095; include /etc/nginx/snippets/graduss-proxy.conf; }
    location = /api/auth/register { limit_req zone=graduss_auth burst=3 nodelay; proxy_pass http://127.0.0.1:8095; include /etc/nginx/snippets/graduss-proxy.conf; }

    location /api/ {
        limit_req zone=graduss_api burst=40 nodelay;
        include /etc/nginx/snippets/graduss-headers.conf;
        proxy_pass http://127.0.0.1:8095;
        include /etc/nginx/snippets/graduss-proxy.conf;
    }

    # WAV nginx'ning standart turlar ro'yxatida yo'q (application/octet-stream bo'lib qoladi): namunaviy qo'shiqlar uchun.
    location ~* \.wav$ {
        default_type audio/wav;
        expires 7d;
        include /etc/nginx/snippets/graduss-headers.conf;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        expires 1d;
        include /etc/nginx/snippets/graduss-headers.conf;
        try_files $uri =404;
    }

    # Hash'li statik fayllar: bir yil keshlanadi.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/graduss-headers.conf;
        try_files $uri =404;
    }

    # SPA: noma'lum yo'llar index.html'ga (keshlanmaydi).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/graduss-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

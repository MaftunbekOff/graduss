[package]
name = "graduss-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graduss-api"
path = "src/main.rs"

# Xotira cheklangan server: LTO o'chiq, codegen-units kichik (earlyoom rustc'ni o'ldirmasligi uchun)
[profile.release]
opt-level = 2
lto = false
codegen-units = 4
panic = "abort"
strip = true

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", features = ["limit", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
